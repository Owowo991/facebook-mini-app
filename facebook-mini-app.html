<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook Mini App</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f0f2f5;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:32px 24px;text-align:center;width:min(90%,360px);box-shadow:0 8px 30px rgba(0,0,0,.12)}
h1{color:#1877f2;margin:0 0 12px} p{color:#555;line-height:1.5}
a{display:inline-block;background:#1877f2;color:#fff;text-decoration:none;padding:14px 28px;border-radius:10px;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>Facebook</h1>
<p>Open Facebook and sign in using Facebook's official login page.</p>
<a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">Open Facebook</a>
</div>
</body>
</html>
